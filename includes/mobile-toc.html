<script>
document.addEventListener("DOMContentLoaded", () => {
  const source = document.querySelector("#quarto-margin-sidebar nav#TOC > ul");
  const main = document.querySelector("main.content");

  if (!main) return;

  const feedback = document.createElement("aside");
  feedback.className = "page-feedback";
  feedback.setAttribute("aria-label", "Comentarios sobre esta página");

  const prompt = document.createElement("span");
  prompt.textContent = "¿Encontraste un error?";

  const pageReference = encodeURIComponent(`Página: ${window.location.href}\n\n`);
  const report = document.createElement("a");
  report.href = `https://github.com/diegoigmorales/MGP/issues/new?title=Error%20en%20una%20página&body=${pageReference}`;
  report.textContent = "Informar";

  const separator = document.createTextNode(" · ");
  const proposal = document.createElement("a");
  proposal.href = `https://github.com/diegoigmorales/MGP/issues/new?title=Propuesta%20de%20mejora&body=${pageReference}`;
  proposal.textContent = "Proponer una mejora";

  feedback.append(prompt, document.createTextNode(" "), report, separator, proposal);
  main.appendChild(feedback);

  if (!source || document.querySelector(".mobile-page-toc")) return;

  const details = document.createElement("details");
  details.className = "mobile-page-toc";

  const summary = document.createElement("summary");
  summary.textContent = "En esta página";

  const nav = document.createElement("nav");
  nav.setAttribute("aria-label", "Tabla de contenidos de esta página");

  const list = source.cloneNode(true);
  list.querySelectorAll("[id]").forEach((element) => element.removeAttribute("id"));
  list.querySelectorAll(".collapse").forEach((element) => element.classList.remove("collapse"));
  nav.appendChild(list);
  details.append(summary, nav);

  const title = main.querySelector("#title-block-header");
  if (title) title.insertAdjacentElement("afterend", details);
  else main.prepend(details);

  nav.querySelectorAll("a").forEach((link) => {
    link.addEventListener("click", () => details.removeAttribute("open"));
  });
});
</script>
