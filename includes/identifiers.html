<script>
(() => {
  const key = "mgp.show-identifiers";
  let enabled = false;
  try { enabled = localStorage.getItem(key) === "true"; } catch (_) {}
  document.documentElement.classList.toggle("mgp-show-identifiers", enabled);
  document.addEventListener("DOMContentLoaded", () => {
    const main = document.querySelector("main.content");
    if (!main) return;
    const badge = (element, code, target) => {
      const row = document.createElement("div");
      row.className = "identifier-row";
      const link = document.createElement("a");
      link.className = "knowledge-tag";
      link.textContent = code;
      link.href = "#" + target;
      link.setAttribute("aria-label", "Enlace permanente al objeto " + code);
      row.append(link);
      element.prepend(row);
    };
    main.querySelectorAll("[data-environment-tag]").forEach((element) => {
      badge(element, element.dataset.environmentTag, element.id);
      const title = element.querySelector(".theorem-title");
      if (title && !title.querySelector("a")) {
        const link = document.createElement("a");
        link.href = "#" + element.id;
        link.className = "environment-permalink";
        while (title.firstChild) link.append(title.firstChild);
        title.append(link);
      }
    });
    main.querySelectorAll(".knowledge-object[data-tag]").forEach((element) => {
      const code = element.dataset.tag;
      const ownsCode = [...element.querySelectorAll("[data-environment-tag]")]
        .some((environment) => environment.dataset.environmentTag === code);
      if (!ownsCode) badge(element, code, element.id);
    });
    if (!main.querySelector(".identifier-row")) return;
    const control = document.createElement("div");
    control.className = "identifier-control";
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = enabled;
    const text = document.createElement("span");
    text.textContent = "Mostrar identificadores";
    label.append(input, text);
    control.append(label);
    const title = main.querySelector("#title-block-header");
    if (title) title.insertAdjacentElement("afterend", control);
    else main.prepend(control);
    input.addEventListener("change", () => {
      enabled = input.checked;
      document.documentElement.classList.toggle("mgp-show-identifiers", enabled);
      try { localStorage.setItem(key, String(enabled)); } catch (_) {}
    });
    window.addEventListener("storage", (event) => {
      if (event.key !== key && event.key !== null) return;
      enabled = event.key === null ? false : event.newValue === "true";
      input.checked = enabled;
      document.documentElement.classList.toggle("mgp-show-identifiers", enabled);
    });
  });
})();
</script>
