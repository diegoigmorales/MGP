project:
  type: book
  pre-render: python scripts/build_registry.py
  output-dir: _site

book:
  title: "Matemática para Gañanes y Patanes"
  subtitle: "Matemática y conocimiento profesional para la enseñanza"
  site-url: https://diegoigmorales.github.io/MGP/
  repo-url: https://github.com/diegoigmorales/MGP
  page-navigation: true
  search: true
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - acerca.qmd
    - part: contenidos/libro/index.qmd
      chapters:
        - contenidos/libro/numeros/porcentajes.qmd
        - contenidos/libro/estadistica/index.qmd
    - part: contenidos/curriculo-evaluacion.qmd
      chapters:
        - contenidos/curriculum/index.qmd
        - contenidos/paes/index.qmd
  page-footer:
    center: "Para enseñar sin fingir que nunca olvidamos nada."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-expand: false
    toc-depth: 3
    code-copy: true
    format-links: false
    include-after-body: includes/mobile-toc.html
    filters:
      - filters/paes-question.lua
      - filters/knowledge.lua
    number-sections: true
  pdf:
    documentclass: scrreprt
    toc: true
    filters:
      - filters/paes-question.lua
      - filters/knowledge.lua

lang: es
execute:
  freeze: auto
