project:
  type: website
  pre-render: python scripts/build_registry.py
  output-dir: _site
  render:
    - "*.qmd"
    - "contenidos/**/*.qmd"
    - "!contenidos/universitario/"
    - "!contenidos/paes/m2/"

website:
  title: "Matemática para Gañanes y Patanes"
  site-url: https://diegoigmorales.github.io/MGP/
  repo-url: https://github.com/diegoigmorales/MGP
  page-navigation: true
  navbar:
    collapse-below: lg
    left:
      - href: contenidos/index.qmd
        text: Contenido
      - text: PAES
        menu:
          - href: contenidos/paes/index.qmd
            text: Preparación PAES
          - href: contenidos/paes/temarios/vigente.qmd
            text: Temario vigente
          - href: contenidos/paes/temarios/evolucion/index.qmd
            text: Evolución histórica
          - href: contenidos/paes/m1/admision-2027-invierno/index.qmd
            text: M1 Invierno · Admisión 2027
          - href: contenidos/paes/m1/preguntas-originales/porcentajes.qmd
            text: Pregunta original
      - href: contenidos/libro/index.qmd
        text: Matemática
      - href: contenidos/curriculum/index.qmd
        text: Currículum
      - href: acerca.qmd
        text: Acerca de
  page-footer:
    center: "Para enseñar sin fingir que nunca olvidamos nada."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    code-copy: true
    format-links: false
    include-after-body: includes/mobile-toc.html
    filters:
      - filters/knowledge.lua
    number-sections: false
  pdf:
    documentclass: scrreprt
    toc: true
    filters:
      - filters/knowledge.lua

lang: es
execute:
  freeze: auto
