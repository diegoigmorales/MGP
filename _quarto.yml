project:
  type: website
  pre-render:
    - python scripts/math_notation.py --check
    - python scripts/build_registry.py
  output-dir: _site

website:
  title: "Matemática para Gañanes y Patanes"
  site-url: https://diegoigmorales.github.io/MGP/
  repo-url: https://github.com/diegoigmorales/MGP
  page-navigation: true
  search: true
  sidebar:
    collapse-level: 1
    contents:
      - text: "Portada"
        href: index.qmd
      - text: "Sobre MGP"
        href: acerca.qmd
      - section: "Parte I. Matemática escolar para la enseñanza"
        href: contenidos/libro/index.qmd
        contents:
          - text: "Capítulo 1. Magnitudes, medición y unidades"
            href: contenidos/libro/numeros/magnitudes-medicion-unidades.qmd
          - text: "Capítulo 2. Números naturales"
            href: contenidos/libro/numeros/numeros-naturales.qmd
          - text: "Capítulo 3. Números enteros"
            href: contenidos/libro/numeros/numeros-enteros.qmd
          - text: "Capítulo 4. Números racionales"
            href: contenidos/libro/numeros/numeros-racionales.qmd
          - text: "Capítulo 5. Números reales"
            href: contenidos/libro/numeros/numeros-reales.qmd
          - text: "Capítulo 6. Razones y proporcionalidad"
            href: contenidos/libro/numeros/razones-proporcionalidad.qmd
          - text: "Capítulo 7. Porcentajes"
            href: contenidos/libro/numeros/porcentajes.qmd
          - text: "Capítulo 8. Potencias, raíces y logaritmos"
            href: contenidos/libro/algebra/potencias-raices-logaritmos.qmd
          - text: "Capítulo 9. Álgebra elemental"
            href: contenidos/libro/algebra/algebra-elemental.qmd
          - text: "Capítulo 10. Ecuaciones e inecuaciones"
            href: contenidos/libro/algebra/ecuaciones-inecuaciones.qmd
          - text: "Capítulo 11. Sucesiones y series elementales"
            href: contenidos/libro/algebra/sucesiones-series.qmd
          - text: "Capítulo 12. Funciones"
            href: contenidos/libro/algebra/funciones.qmd
          - text: "Capítulo 13. Combinatoria y probabilidad"
            href: contenidos/libro/probabilidad/combinatoria-probabilidad.qmd
          - text: "Capítulo 14. Estadística escolar"
            href: contenidos/libro/estadistica/index.qmd
      - section: "Parte II. Currículo, evaluación y desarrollo profesional"
        href: contenidos/curriculo-evaluacion.qmd
        contents:
          - text: "Capítulo 15. Sistema curricular chileno"
            href: contenidos/curriculum/index.qmd
          - text: "Capítulo 16. PAES de Matemática"
            href: contenidos/paes/index.qmd
  page-footer:
    center: "Para enseñar sin fingir que nunca olvidamos nada."

format:
  pdf:
    include-in-header: includes/theorem-styles.tex
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-expand: false
    toc-depth: 3
    code-copy: true
    format-links: false
    include-after-body:
      - includes/mobile-toc.html
      - includes/identifiers.html
    filters:
      - filters/paes-question.lua
      - filters/knowledge.lua
    number-sections: false

lang: es
execute:
  freeze: auto
