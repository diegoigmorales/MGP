project:
  type: website
  pre-render:
    - python scripts/math_notation.py --check
    - python scripts/build_registry.py
  output-dir: _site

website:
  title: "Matemática para Gañanes y Patanes"
  site-url: https://diegoigmorales.github.io/MGP/
  repo-url: https://github.com/diegoigmorales/MGP
  page-navigation: true
  search: true
  sidebar:
    collapse-level: 1
    contents:
      - text: "Portada"
        href: index.qmd
      - text: "Sobre MGP"
        href: acerca.qmd
      - section: "Parte I. Matemática escolar para la enseñanza"
        href: contenidos/libro/index.qmd
        contents:
          - text: "Capítulo 1. Porcentajes"
            href: contenidos/libro/numeros/porcentajes.qmd
          - text: "Capítulo 2. Combinatoria y probabilidad"
            href: contenidos/libro/probabilidad/combinatoria-probabilidad.qmd
          - text: "Capítulo 3. Estadística escolar"
            href: contenidos/libro/estadistica/index.qmd
      - section: "Parte II. Currículo, evaluación y desarrollo profesional"
        href: contenidos/curriculo-evaluacion.qmd
        contents:
          - text: "Capítulo 4. Sistema curricular chileno"
            href: contenidos/curriculum/index.qmd
          - text: "Capítulo 5. PAES de Matemática"
            href: contenidos/paes/index.qmd
  page-footer:
    center: "Para enseñar sin fingir que nunca olvidamos nada."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-expand: false
    toc-depth: 3
    code-copy: true
    format-links: false
    include-after-body: includes/mobile-toc.html
    filters:
      - filters/paes-question.lua
      - filters/knowledge.lua
    number-sections: false

lang: es
execute:
  freeze: auto
